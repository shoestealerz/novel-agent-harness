name: Writer harness

on:
  pull_request:
    paths:
      - "packages/writer/**"
      - "packages/writer-bench/**"
      - "packages/opencode/src/agent/agent.ts"
      - "packages/opencode/src/agent/prompt/writer.txt"
      - "packages/opencode/src/tool/novel.ts"
      - "packages/opencode/src/tool/registry.ts"
      - "packages/opencode/src/writer/**"
      - "packages/opencode/src/cli/cmd/writer.ts"
      - "packages/opencode/src/index.ts"
      - "packages/opencode/test/agent/agent.test.ts"
      - "packages/opencode/test/tool/novel.test.ts"
      - "packages/opencode/test/tool/registry.test.ts"
      - "packages/opencode/test/writer/**"
      - "packages/opencode/test/cli/writer.test.ts"
      - "packages/opencode/test/cli/writer-process.test.ts"
      - "packages/opencode/test/lib/cli-process.ts"
      - ".github/workflows/writer-bench.yml"
      - "bun.lock"
  push:
    branches:
      - dev
    paths:
      - "packages/writer/**"
      - "packages/writer-bench/**"
      - "packages/opencode/src/agent/agent.ts"
      - "packages/opencode/src/agent/prompt/writer.txt"
      - "packages/opencode/src/tool/novel.ts"
      - "packages/opencode/src/tool/registry.ts"
      - "packages/opencode/src/writer/**"
      - "packages/opencode/src/cli/cmd/writer.ts"
      - "packages/opencode/src/index.ts"
      - "packages/opencode/test/agent/agent.test.ts"
      - "packages/opencode/test/tool/novel.test.ts"
      - "packages/opencode/test/tool/registry.test.ts"
      - "packages/opencode/test/writer/**"
      - "packages/opencode/test/cli/writer.test.ts"
      - "packages/opencode/test/cli/writer-process.test.ts"
      - "packages/opencode/test/lib/cli-process.ts"
      - ".github/workflows/writer-bench.yml"
      - "bun.lock"
  workflow_dispatch:

jobs:
  verify:
    name: verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Validate production PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "packages/writer-bench/production/run-deepseek.ps1"),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
      - run: bun typecheck
        working-directory: packages/writer
      - run: bun test --timeout 30000
        working-directory: packages/writer
      - run: bun typecheck
        working-directory: packages/opencode
      - run: bun test --timeout 30000 test/writer/session.test.ts test/tool/novel.test.ts test/tool/registry.test.ts test/cli/writer.test.ts test/cli/writer-process.test.ts test/cli/help/help-snapshots.test.ts
        working-directory: packages/opencode
      - run: bun test test/agent/agent.test.ts -t "writer agent remains proposal-only"
        working-directory: packages/opencode
      - run: bun typecheck
        working-directory: packages/writer-bench
      - run: bun test
        working-directory: packages/writer-bench
      - run: bun run corpus:validate
        working-directory: packages/writer-bench
      - run: bun run smoke
        working-directory: packages/writer-bench
      - run: bun run smoke:compare
        working-directory: packages/writer-bench
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: writer-benchmark-smoke-${{ matrix.os }}
          path: packages/writer-bench/.results
          include-hidden-files: true
