name: Writer benchmark

on:
  pull_request:
    paths:
      - "packages/writer-bench/**"
      - ".github/workflows/writer-bench.yml"
      - "bun.lock"
  push:
    branches:
      - dev
    paths:
      - "packages/writer-bench/**"
      - ".github/workflows/writer-bench.yml"
      - "bun.lock"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/writer-bench typecheck
      - run: bun run --cwd packages/writer-bench test
      - run: bun run --cwd packages/writer-bench smoke
      - run: bun run --cwd packages/writer-bench smoke:compare
      - uses: actions/upload-artifact@v4
        with:
          name: writer-benchmark-smoke
          path: packages/writer-bench/.results
