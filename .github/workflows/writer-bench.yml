name: Writer harness

on:
  pull_request:
    paths:
      - "packages/writer/**"
      - "packages/writer-bench/**"
      - "packages/opencode/src/agent/agent.ts"
      - "packages/opencode/src/agent/prompt/writer.txt"
      - "packages/opencode/src/tool/novel.ts"
      - "packages/opencode/src/tool/registry.ts"
      - "packages/opencode/src/writer/**"
      - "packages/opencode/test/agent/agent.test.ts"
      - "packages/opencode/test/tool/novel.test.ts"
      - "packages/opencode/test/tool/registry.test.ts"
      - "packages/opencode/test/writer/**"
      - ".github/workflows/writer-bench.yml"
      - "bun.lock"
  push:
    branches:
      - dev
    paths:
      - "packages/writer/**"
      - "packages/writer-bench/**"
      - "packages/opencode/src/agent/agent.ts"
      - "packages/opencode/src/agent/prompt/writer.txt"
      - "packages/opencode/src/tool/novel.ts"
      - "packages/opencode/src/tool/registry.ts"
      - "packages/opencode/src/writer/**"
      - "packages/opencode/test/agent/agent.test.ts"
      - "packages/opencode/test/tool/novel.test.ts"
      - "packages/opencode/test/tool/registry.test.ts"
      - "packages/opencode/test/writer/**"
      - ".github/workflows/writer-bench.yml"
      - "bun.lock"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun typecheck
        working-directory: packages/writer
      - run: bun test
        working-directory: packages/writer
      - run: bun typecheck
        working-directory: packages/opencode
      - run: bun test test/writer/session.test.ts test/tool/novel.test.ts test/agent/agent.test.ts test/tool/registry.test.ts
        working-directory: packages/opencode
      - run: bun typecheck
        working-directory: packages/writer-bench
      - run: bun test
        working-directory: packages/writer-bench
      - run: bun run corpus:validate
        working-directory: packages/writer-bench
      - run: bun run smoke
        working-directory: packages/writer-bench
      - run: bun run smoke:compare
        working-directory: packages/writer-bench
      - uses: actions/upload-artifact@v4
        with:
          name: writer-benchmark-smoke
          path: packages/writer-bench/.results
          include-hidden-files: true
