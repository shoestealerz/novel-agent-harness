name: pr-standards

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate title and description
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const pr = context.payload.pull_request
            const problems = []
            const titlePattern = /^(feat|fix|docs|chore|refactor|test)(\([a-zA-Z0-9-]+\))?: .+/
            if (!titlePattern.test(pr.title)) {
              problems.push("title must use conventional commit form, for example feat(writer): add a bounded context mode")
            }

            const body = pr.body || ""
            const required = [
              "### Issue for this PR",
              "### Type of change",
              "### What does this PR do?",
              "### Author authority and data safety",
              "### How did you verify your code works?",
              "### Checklist",
            ]
            for (const heading of required) {
              if (!body.includes(heading)) problems.push(`missing required section: ${heading}`)
            }

            const type = body.match(/### Type of change\s*\n([\s\S]*?)(?=\n###|$)/)?.[1] || ""
            if (!/- \[x\]/i.test(type)) problems.push("select at least one type of change")

            const checklist = body.match(/### Checklist\s*\n([\s\S]*?)(?=\n###|$)/)?.[1] || ""
            if (/- \[ \]/.test(checklist)) problems.push("complete every applicable checklist item")

            if (problems.length) {
              core.setFailed(problems.join("\n"))
            } else {
              core.info("PR title and description meet repository standards")
            }
