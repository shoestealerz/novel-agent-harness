name: alpha-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact prerelease tag; must match v + root package version
        required: true
        type: string
        default: v0.1.0-alpha.1

permissions:
  contents: read

concurrency:
  group: alpha-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref_name == 'dev'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
        working-directory: packages/writer
      - run: bun run test
        working-directory: packages/writer
      - run: bun run typecheck
        working-directory: packages/opencode
      - run: bun test --timeout 30000 test/writer/session.test.ts test/tool/novel.test.ts test/tool/registry.test.ts test/cli/writer.test.ts test/cli/writer-process.test.ts test/cli/help/help-snapshots.test.ts
        working-directory: packages/opencode
      - run: bun test test/agent/agent.test.ts -t "writer agent remains proposal-only"
        working-directory: packages/opencode
      - run: bun run typecheck
        working-directory: packages/writer-bench
      - run: bun run test
        working-directory: packages/writer-bench
      - run: bun run corpus:validate
        working-directory: packages/writer-bench
      - run: bun run smoke
        working-directory: packages/writer-bench
      - run: bun run smoke:compare
        working-directory: packages/writer-bench

  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate tag and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          test "$RELEASE_TAG" = "v$version"
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*-alpha.[0-9]*) ;;
            *) echo "Not an alpha tag: $RELEASE_TAG" >&2; exit 1 ;;
          esac
          git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1 && {
            echo "Tag already exists: $RELEASE_TAG" >&2
            exit 1
          }
      - name: Create GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Novel Agent Harness $RELEASE_TAG" \
            --notes-file ALPHA_RELEASE_NOTES.md \
            --prerelease
