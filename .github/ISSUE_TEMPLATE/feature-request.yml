name: Feature request
description: Propose a writer capability, reliability mechanism, or evaluation improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Writer problem
      description: What author workflow or reliability problem should the harness solve?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe observable behavior without prescribing an implementation when possible.
    validations:
      required: true
  - type: textarea
    id: authority
    attributes:
      label: Author authority and failure cases
      description: What must the model never do, and how should stale, ambiguous, or unsafe requests fail?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evaluation evidence
      description: How could we measure that this helps without hiding a safety regression in an aggregate score?
    validations:
      required: false
