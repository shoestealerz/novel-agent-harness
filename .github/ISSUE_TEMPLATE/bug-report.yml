name: Bug report
description: Report a reproducible problem in the writer harness or benchmark runner
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead. Remove private manuscript text and secrets.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Writer CLI or session
        - Workspace, proposal, or commit transaction
        - Story state
        - Benchmark runner or evaluation target
        - Generic OpenCode runtime
        - Documentation or CI
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include commands and a synthetic or redacted workspace when possible.
      placeholder: |
        1. Run ...
        2. Review ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Harness version or commit
      placeholder: v0.1.0-alpha.2 or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Bun 1.3.14, Node 22
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant redacted output
      description: Do not include API keys, private prose, or provider credentials.
      render: shell
    validations:
      required: false
